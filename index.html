<!DOCTYPE html>
<html lang="fr">
  
  <head>
    <meta charset="utf-8">
    <title>Étiquette QR</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="./lib/qrcode.min.js"></script>
    <script src="./js/index.mjs" type="module"></script>
    <link rel="stylesheet" href="css/zoom.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  
  <body>
    <!-- Mise à jour des visuels -->
    <button id="update_labels_btn">Mise à jour des visuels (<span class="label_count"></span>)</button>
    <!-- Modifie tous les liens -->
    <button id="trigger_url_update_btn">Renouvellement (<span class="label_count"></span>)</button>
    <h2 id="record_name"></h2>
        <div id="labels">
            <div id="label" class="label_box"><img src="" class="label invalid zoomable empty"/></div>
            <button id="save_label_btn">⬅ Enregistrer</button>
            <div id="preview" class="label_box"><img src="./img/no_label.png" class="zoomable empty"/></div>
        </div>

    <!-- Zoom -->
    <dialog id="zoom_dialog" class="zoom">
        <button commandfor="zoom_dialog" command="close" class="zoom_close_btn"></button>
        <img id="zoomed" src="" class="zoom"/>
    </dialog>



    <!-- Réglages -->
    <dialog id="config_dialog">
        <div>
            <div id="config_header">
                <div id="config_title">Configuration du widget</div>
                <button id="cancel_options_btn">Annuler</button>
                <button id="reset_options_btn">Reset</button>
                <button id="save_options_btn">Enregistrer</button>
            </div>
            <iframe id="configuration"
                    title="Configuration"
                    src="./config.form.html"
                    loading="lazy">
            </iframe>
        </div>
    </dialog>

  </body>
  
</html>
