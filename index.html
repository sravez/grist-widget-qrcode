<!DOCTYPE html>
<html lang="fr">
  
  <head>
    <meta charset="utf-8">
    <title>QR Code</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="./lib/qrcode.min.js"></script>
    <script src="./js/index.mjs" type="module"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  
  <body>
    <dialog id="settings" closedby="none">
    </dialog>
    
    <h2>Étiquettes</h2>
        <div id="label" class="">
          <img src="./img/no_label.png" class="zoomable empty"/>
          <p>Etiquette</p>
        </div>
        <div id="preview">
          <img src = "./img/no_label.png" class="zoomable empty"/>
          <p>Preview</p>
        </div>

        <button id="save_btn">Enregistrer</button>

    <!-- Zoom -->
    <dialog id="zoom_dialog" class="zoom">
        <button commandfor="zoom_dialog" command="close" class="close_btn"></button>
        <img id="zoom" src="" class="zoom"/>
    </dialog>



    <!-- Réglages -->
    <dialog id="config_dialog">
        <div>
            <div id="config_header">
                <div id="config_title">Configuration du widget</div>
                <button id="cancel_btn">Annuler</button>
                <button id="save_options_btn">Enregistrer</button>
            </div>
            <iframe id="configuration"
                    title="Configuration"
                    src="./config.form.html">
            </iframe>
        </div>
    </dialog>

  </body>
  
</html>
