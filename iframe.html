<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Configuration</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <div id="config_dialog">
    <div id="config_title">
      Configuration du Widget
      <div id="buttons">
        <button id="settings_cancel">Annuler</button>
        <button id="settings_save">Enregistrer</button>
      </div>
    </div>
    <iframe id="configuration"
            title="Configuration"
            src="./config.html">
    </iframe>
</div>

<script>

  window.onload = () => {
    const config = document.getElementById("configuration");

    window.addEventListener("message", (e) => {
      if(e.origin === window.location.origin) {
        switch(e.data.action) {
          case "sendConfig":
            console.debug("config received by top")
            console.debug(e.data.data);
            break;
        }
      }
    })

    //document.getElementById("config_dialog").showModal();

    config.contentWindow.postMessage({
      action: "setConfig",
      data: {}
    });
    config.contentWindow.postMessage({
      action: "getConfig",
      data: {}
    });
  }
</script>
</body>
</html>
