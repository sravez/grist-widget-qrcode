<!DOCTYPE html>
<html lang="fr">
  
  <head>
	<meta charset="utf-8">
	<title>QRCodeJS</title>
	<script src="./lib/qrcode.min.js"></script>
	<script type="text/javascript">
		
		
		function getQRC(val) {
			alert(val)
			const div = document.createElement('div')
			new QRCode(div, {
				text: val,
				width: 128,
				height: 128,
				colorDark : "#000000",
				colorLight : "#ffffff",
				correctLevel : QRCode.CorrectLevel.H
			});
			return div.querySelector("img")
		}
		function test() {
			const img = getQRC("test")
			document.body.append(img)
		}
	</script>
  </head>
  
  <body onload="test()">
	  
	<h1>QRCodeJS</h1>  
  </body>
  
</html>
