<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>QR Code - Configuration</title>
    <script src="./lib/qrcode.min.js"></script>
    <script src="./js/config.mjs" type="module"></script>
    <link rel="stylesheet" href="./css/config.css" />
</head>

<body>
    <form id="config_form">
        <div id="options">            
            <div id="section_display" class="section">
                <div class="section_title">Interface</div>
                <div class="controls">
                    <label for="display.size">Taille :</label>
                    <select id="display.size" name="display.size">
                        <option value="-1"> Taille réelle</option>
                        <option value="32" selected>32</option>
                        <option value="64" selected>64</option>
                        <option value="128">128</option>
                        <option value="256">256</option>
                    </select>
                    
                    <label for="display.auto_next">Génération :</label>
                    <select id="display.auto_next" name="display.auto_next">
                        <option value="always">Toujours</option>  
                        <option value="invalid">Si invalide</option>
                        <option value="never">Jamais</option>  
                    </select>
                    
                    <label>Mise à jour :</label>
                    <span>
                        <input type="checkbox" id="display.btn_update_all" name="display.btn_update_all" value="true"/>
                        <label for="display.btn_update_all">Tous</label>
                        
                        <input type="checkbox" id="display.btn_update_invalid" name="display.btn_update_invalid" value="true"/>
                        <label for="display.btn_update_invalid">Invalides</label>
                    </span>
                </div>
                <div class="r"></div>
            </div>    
            
            <div id="section_qrcode" class="section">
                <div class="section_title">
                    QR Code
                    <div id="qrcode_help" popover><img src="./img/help.png"/></div>
                    <img id="display_qrcode_help" src="img/questionmark.png" class="display_help"/>
                </div>
                <div class="controls">
                    <label>Dimensions :</label>
                    <span>
                        <label for="qrcode.size" class="dim">L :</label>
                        <input id="qrcode.size" name="qrcode.size" type="number" min="128" value="256"/>
                        
                        <label for="qrcode.margin" class="dim">M :</label>
                        <input id="qrcode.margin" name="qrcode.margin" type="number" min="10" value="10"/>
                    </span>
                    <label></label>
                    <span>
                        <label for="qrcode.border" class="dim">B :</label>
                        <input id="qrcode.border" name="qrcode.border" type="number" min="0" value="20"/>
                    
                        <label for="qrcode.text_size" class="dim">T :</label>
                        <input id="qrcode.text_size" name="qrcode.text_size" type="number" min="6" value="16"/>
                    </span>
                
                    <label>Couleurs :</label>
                    <span>
                        <label for="qrcode.foreground_color" class="colorLabel">C<sub>c</sub> :</label>
                        <input id="qrcode.foreground_color" name="qrcode.foreground_color" type="color" value="#ffffff"/>

                        <span class="SyncBtn" data-src="qrcode.foreground_color" data-dest="qrcode.text_color">=></span>

                        <label for="qrcode.text_color" class="colorLabel">C<sub>t</sub> :</label>
                        <input id="qrcode.text_color" name="qrcode.text_color" type="color" value="#ffffff"/>
                    </span>
                    <label></label>
                    <span>
                        <label for="qrcode.background_color" class="colorLabel">C<sub>f</sub> :</label>
                        <input id="qrcode.background_color" name="qrcode.background_color" type="color" value="#ffffff"/>

                        <span class="SyncBtn" data-src="qrcode.background_color" data-dest="qrcode.border_color">=></span>

                        <label for="qrcode.border_color" class="colorLabel">C<sub>b</sub> :</label>
                        <input id="qrcode.border_color" name="qrcode.border_color" type="color" value="#ffffff"/>
                    </span>

                    <label for="qrcode.redundancy">Résilience :</label>
                    <select id="qrcode.redundancy" name="qrcode.redundancy">
                        <option value="L">Basse</option>
                        <option value="M">Moyenne</option>
                        <option value="Q">Standard</option>
                        <option value="H">Haute</option>
                    </select>
                       
                </div>
                <div id="preview" class="r">
                    <img id="preview_img" src="./img/click.png" width="128px" height="128px" class="empty" alt="preview"/>
                    <div id="preview_popover" popover><img id="preview_popover_img" src=""/></div>
                    <span>
                        <input id="autoPreview" name="autoPreview" type="checkbox" value="1"/>
                        <label for="autoPreview">auto</label>
                    </span>    
                </div>
            </div>    
            
            <div id="section_data" class="section">
                <div class="section_title">Données</div>
                <div class="controls">
                    <label for="data.position">Position :</label>
                    <fieldset id="data.position" name="data.position">
                        <input id="data.position.0" type="radio" name="data.position" value="0"/>
                        <label for="data.position.0">Premier</label>

                        <input id="data.position.-1" type="radio" name="data.position" value="-1"/>
                        <label for="data.position.-1">Dernier</label>
                        Dernier
                    </fieldset>
                    <label for="data.validity">Validité :</label>
                    <fieldset id="data.validity" name="data.validity">
                        <input id="data.validity.col" type="radio" name="data.validity" value="col"/>
                        <label for="data.validity.col">Champ</label>

                        <input id="data.validity.fn" type="radio" name="data.validity" value="fn"/>
                        <label for="data.validity.fn">Nom de fichier</label>

                        <input id="data.validity.none" type="radio" name="data.validity" value="none"/>
                        <label for="data.validity.none">Aucune</label>
                    </fieldset>
                    <label for="data.save_mode">Enregistrement :</label>
                    <fieldset id="data.save_mode" name="save_mode">
                        <input id="data.save_mode.replace" type="radio" name="data.save_mode" value="replace"/>
                        <label for="data.save_mode.replace">Remplacer</label>

                        <input id="data.save_mode.add" type="radio" name="data.save_mode" value="add"/>
                        <label for="data.save_mode.add">Ajouter</label>
                    </fieldset>
                </div>
                <div class="r"></div>
            </div>    
     
        </div>    
    </form>
    <button popovertarget="options_help">Aide</button>
    <button id="settings_cancel">Annuler</button>
    <button id="settings_save">Enregistrer</button>
    <button id="settings_test">Test</button>

</body>

</html>
