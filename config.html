<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>QR Code - Configuration</title>
    <script src="./lib/qrcode.min.js"></script>
    <script src="./js/config.mjs" type="module"></script>
    <link rel="stylesheet" href="./css/config.css" />
</head>

<body>
    <form id="settings_form">
        <div id="options">            
            <div class="section">
                <div class="section_title">Interface</div>
                <div class="controls">
                    <label for="display_size">Taille :</label>
                    <select id="display_size" name="display_size">
                        <option value="-1"> Taille réelle</option>
                        <option value="32" selected>32</option>
                        <option value="64" selected>64</option>
                        <option value="128">128</option>
                        <option value="256">256</option>
                    </select>
                    
                    <label for="display_auto_next">Génération :</label>
                    <select id="display_auto_next" name="display_auto_next">
                        <option value="always">Toujours</option>  
                        <option value="invalid">Si invalide</option>
                        <option value="never">Jamais</option>  
                    </select>
                    
                    <label>Mise à jour :</label>
                    <span>
                        <input type="checkbox" id="display_btn_update_all" name="display_btn_update_all" value="true"/>
                        <label for="display_btn_update_all">Tous</label>
                        
                        <input type="checkbox" id="display_btn_update_invalid" name="display_btn_update_invalid" value="true"/>
                        <label for="display_btn_update_invalid">Invalides</label>
                    </span>
                </div>
                <div class="r"></div>
            </div>    
            
            <div class="section">
                <div class="section_title">
                    QR Code
                    <div id="options_help" popover><img src="./img/help.png" /></div>
                    <img src="./img/questionmark.png" id="display_help" onclick="document.getElementById('options_help').showPopover()"/>
                </div>
                <div class="controls">
                    <label>Dimensions :</label>
                    <span>
                        <label for="qrcode_size" class="dim">L :</label>
                        <input id="qrcode_size" name="qrcode_size" type="number" min="128" value="256"/>
                        
                        <label for="qrcode_margin" class="dim">M :</label>
                        <input id="qrcode_margin" name="qrcode_margin" type="number" min="10" value="10"/>
                    </span>
                    <label></label>
                    <span>
                        <label for="qrcode_border" class="dim">B :</label>
                        <input id="qrcode_border" name="qrcode_border" type="number" min="0" value="20"/>
                    
                        <label for="qrcode_text_size" class="dim">T :</label>
                        <input id="qrcode_text_size" name="qrcode_text_size" type="number" min="6" value="16"/>
                    </span>
                
                    <label>Couleurs :</label>
                    <span>
                        <label for="qrcode_foreground_color" class="colorLabel">C<sub>c</sub> :</label>
                        <input id="qrcode_foreground_color" name="qrcode_foreground_color" type="color" value="#ffffff"/>
                        
                        <label for="qrcode_background_color" class="colorLabel">C<sub>f</sub> :</label>
                        <input id="qrcode_background_color" name="qrcode_background_color" type="color" value="#ffffff"/>
                    </span>
                    <label></label>
                    <span>
                        <label for="qrcode_text_color" class="colorLabel">C<sub>t</sub> :</label>
                        <input id="qrcode_text_color" name="qrcode_text_color" type="color" value="#ffffff"/>

                        <label for="qrcode_border_color" class="colorLabel">C<sub>b</sub> :</label>
                        <input id="qrcode_border_color" name="qrcode_border_color" type="color" value="#ffffff"/>
                    </span>

                    <label for="qrcode_redundancy">Résilience :</label>
                    <select id="qrcode_redundancy" name="qrcode_redundancy">
                        <option value="L">Basse</option>
                        <option value="M">Moyenne</option>
                        <option value="Q">Standard</option>
                        <option value="H">Haute</option>
                    </select>
                       
                </div>
                <div id="options_test" class="r">
                    <img id="options_test_img" src="./img/click.png" width="128px" height="128px" class="empty"/>
                    <span>
                        <input id="qrcode_auto_test" name="qrcode_auto_test" type="checkbox" value="1"/>
                        <label for="qrcode_auto_test">auto</label>

                        <div id="full_size" popover><img id="full_size_img" src="" /></div>
                    </span>    
                </div>
            </div>    
            
            <div class="section">
                <div class="section_title">Données</div>
                <div class="controls">
                    <label for="data_position">Position :</label>
                    <fieldset id="data_position" name="data_position">
                        <input type="radio" name="data_position" value="0">Premier</option>
                        <input type="radio" name="data_position" value="-1">Dernier</option>
                    </fieldset>
                    <label for="data_position">Validité :</label>
                    <fieldset id="data_validity" name="data_validity">
                        <input type="radio" name="data_validity" value="column">Champ</option>
                        <input type="radio" name="data_validity" value="filename">Nom de fichier</option>
                        <input type="radio" name="data_validity" value="none">Aucune</option>
                    </fieldset>
                    <label for="data_save_mode">Enregistrement :</label>
                    <fieldset id="data_save_mode" name="save_mode">
                        <input type="radio" name="data_save_mode" value="replace">Remplacer</option>
                        <input type="radio" name="data_save_mode" value="add">Ajouter</option>
                    </fieldset>
                </div>
                <div class="r"></div>
            </div>    
     
        </div>    
    </form>
    <button popovertarget="options_help">Aide</button>
    <button id="settings_cancel">Annuler</button>
    <button id="settings_save">Enregistrer</button>
    <button id="settings_test">Test</button>

</body>

</html>
