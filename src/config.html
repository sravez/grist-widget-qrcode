<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>QR Code - Configuration</title>
  <script src="js/config.js" type="module"></script>
  <link rel="stylesheet" href="css/config.form.css" />
</head>

<body>

<dialog id="help_dialog">
    <div>
      <iframe id="help_iframe" src="help_display.html"></iframe>
    </div>
</dialog>

<form id="config_form">

  <section id="section_display">

    <div class="section_title">
      <img src="img/section_display.png" height="14px" class="section_icon" alt="Icône de la section"/>
      Interface
      <img src="img/help.png" class="help_btn" data-target="display" alt="Aide sur la section"/>
    </div>


    <!-- Contrôles -->
    <label for="display.size">Taille :</label>
    <select id="display.size" name="display.size">
      <option value="-1"> Taille réelle</option>
      <option value="32" selected>32</option>
      <option value="64" selected>64</option>
      <option value="128">128</option>
      <option value="256">256</option>
    </select>

    <label for="display.auto_next">Génération :</label>
    <select id="display.auto_next" name="display.auto_next">
      <option value="always">Toujours</option>
      <option value="invalid">Si invalide</option>
      <option value="never">Jamais</option>
    </select>

  </section>

  <section id="section_data">

    <div class="section_title">
      <img src="img/section_data.png" height="14px" class="section_icon" alt="Icône de la section"/>
      Enregistrement
      <img src="img/help.png" class="help_btn" data-target="data" alt="Aide sur la section"/>
    </div>
    <!-- Contrôles -->
    <label for="data.position">Position :</label>
    <select id="data.position" name="data.position">
      <option value="0">Première</option>
      <option value="-1">Dernière</option>
    </select>

    <label for="data.save_mode">Mode :</label>
    <select id="data.save_mode" name="data.save_mode">
      <option value="replace">Remplacer</option>
      <option value="add">Ajouter</option>
    </select>

  </section>

  <section id="section_qrcode">
    <div class="section_title">
      <img src="img/section_qrcode.png" height="14px" class="section_icon" alt="Icône de la section"/>
      Étiquettes
      <img src="img/help.png" class="help_btn" data-target="qrcode" alt="Aide sur la section"/>
    </div>
    <!-- Contrôles -->
    <label for="qrcode.errorCorrectionLevel">Résilience :</label>
    <select id="qrcode.errorCorrectionLevel" name="qrcode.errorCorrectionLevel">
      <option value="L">Basse</option>
      <option value="M">Moyenne</option>
      <option value="Q">Standard</option>
      <option value="H">Haute</option>
    </select>

    <label>Dimensions :</label>
    <span class="multi-control">
      <label for="qrcode.size" class="dim">L :</label>
      <input id="qrcode.size" name="qrcode.size" type="number" min="128" value="256"/>
      <img id="multiply" src="img/multiply.png" alt="Multiplier les dimensions par deux"/>
      <label for="qrcode.text_size" class="dim">T :</label>
      <input id="qrcode.text_size" name="qrcode.text_size" type="number" min="0" value="16"/>
    </span>
    <label></label>
    <span class="multi-control">
      <label for="qrcode.border" class="dim">B :</label>
      <input id="qrcode.border" name="qrcode.border" type="number" min="0" value="20"/>
      <img id="divide" src="img/divide.png" alt="Diviser les dimensions par deux"/>
      <span></span>
      <span></span>
    </span>

    <label><span id="contrast_check">▲ </span>Couleurs :</label>
    <span id="colors">
      <input id="qrcode.fgColor" name="qrcode.fgColor" type="color" value="#000000"/>
      &nbsp;/&nbsp;
      <input id="qrcode.bgColor" name="qrcode.bgColor" type="color" value="#ffffff"/>
    </span>

  </section>

  <section id="section_preview">
    <div id="preview">
      <img id="preview_img" src="img/click.png" width="112px" height="112px" class="empty" alt="preview"/>
      <span id="preview_settings">
        <input id="autoPreview" type="checkbox" value="1" checked="checked"/>
        <label for="autoPreview">Afficher</label>
      </span>
    </div>
    <div id="preview_popover" popover><img id="preview_popover_img" src=""/></div>
  </section>

  <section id="section_print">
    <div class="section_title">
      <img src="img/printer.png" height="14px" class="section_icon" alt="Icône de la section"/>
      Impression
      <img src="img/help.png" class="help_btn" data-target="print" alt="Aide sur la section"/>
    </div>

    <!-- Contrôles -->
    <label>Page :</label>
    <span class="multi-control">
      <label for="print.pageWidth" class="dim">l :</label>
      <input id="print.pageWidth" name="print.pageWidth" type="number" min="11" value="210"/>
      <span></span>
      <label for="print.pageHeight" class="dim">h :</label>
      <input id="print.pageHeight" name="print.pageHeight" type="number" min="1" value="297"/>
    </span>

    <label>Marges :</label>
    <span class="multi-control">
      <label for="print.topMargin" class="dim">T :</label>
      <input id="print.topMargin" name="print.topMargin" type="number" min="0" value="0"/>
      <span></span>
      <label for="print.leftMargin" class="dim">G :</label>
      <input id="print.leftMargin" name="print.leftMargin" type="number" min="0" value="0"/>
    </span>

    <label>Nombre :</label>
    <span class="multi-control">
      <label for="print.rows" class="dim">R :</label>
      <input id="print.rows" name="print.rows" type="number" min="1" value="0"/>
      <span></span>
      <label for="print.cols" class="dim">C :</label>
      <input id="print.cols" name="print.cols" type="number" min="1" value="0"/>
    </span>

    <label>Dimensions :</label>
    <span class="multi-control">
      <label for="print.labelWidth" class="dim">L :</label>
      <input id="print.labelWidth" name="print.labelWidth" type="number" min="1" value="0"/>
      <span></span>
      <label for="print.labelHeight" class="dim">H :</label>
      <input id="print.labelHeight" name="print.labelHeight" type="number" min="1" value="0"/>
    </span>

    <label>Périodes :</label>
    <span class="multi-control">
      <label for="print.hStep" class="dim">h :</label>
      <input id="print.hStep" name="print.hStep" type="number" min="1" value="0"/>
      <span></span>
      <label for="print.vStep" class="dim">v :</label>
      <input id="print.vStep" name="print.vStep" type="number" min="1" value="0"/>
    </span>


  </section>

</form>


</body>

</html>
