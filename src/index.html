<!DOCTYPE html>
<html lang="fr">
  
  <head>
    <meta charset="utf-8">
    <title>Étiquette QR</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="js/index.js" type="module"></script>

    <link rel="stylesheet" href="css/zoom.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  
  <body>
    <div id="selected-label">
        <h2><img src="./img/qrcode.png"/> <span id="card_title">Enregistrement courant</span></h2>
        <div id="labels">
            <div id="label" class="label_box"><img src="" class="label invalid zoomable empty"/></div>
            <button id="save_label_btn">⬅ Enregistrer</button>
            <div id="preview" class="label_box"><img src="img/no_label.png" class="zoomable empty"/></div>
        </div>
    </div>
    <div id="global-actions">
        <h2><img src="./img/globe.png"/> Actions globales</h2>
        <!-- Mise à jour des visuels -->
        <button id="update_labels_btn">Mise à jour des visuels (<span class="label_count"></span>)</button>
        <!-- Modifie tous les liens -->
        <button id="trigger_url_update_btn">Renouvellement (<span class="label_count"></span>)</button>
    </div>
    <!-- Zoom -->

    <dialog id="zoom_dialog" class="zoom">
        <button commandfor="zoom_dialog" command="close" class="zoom_close_btn"></button>
        <img id="zoomed" src="" class="zoom"/>
    </dialog>

    <!-- Réglages -->

    <dialog id="config_dialog">
        <div>
            <div id="config_header">
                <div id="config_title">Configuration du widget</div>
                <button id="cancel_options_btn">Annuler</button>
                <button id="reset_options_btn">Reset</button>
                <button id="default_options_btn">Défaut</button>
                <button id="save_options_btn">Enregistrer</button>
            </div>
            <iframe id="configuration"
                    title="Configuration"
                    src="config.html"
                    loading="lazy">
            </iframe>
        </div>
    </dialog>

    <!-- Impression -->

    <div id="print-selector">
        <h2><img src="./img/printer.png"/> Impression</h2>
        <label for="print-number">Nombre :</label>
        <input id="print-number" name="print-number" type="number" min="1" value="1" />

        <label for="print-offset">Décaler de :</label>
        <input id="print-offset" name="print-offset" type="number"  min="0" value="0" />
        <br/>
        <button id="print-btn">Imprimer<span id="label-count"></span></button>
    </div>
    <div id="print-sheets">

    </div>
  </body>
  
</html>
