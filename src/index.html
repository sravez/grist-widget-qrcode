<!DOCTYPE html>
<!--
Vue principale du widget composée de :

— <div id="selected-label"> : affichage et mise à jour de l'enregistrement courant,
— <div id="global-actions"> : modification en masse,
— <dialog id="zoom_dialog"> : boîte de dialogue affichant les images en taille réelle,
— <dialog id="config_dialog"> : boîte de dialogue affichant un iframe contenant le formulaire de configuration
— <div id="print_selector"> : configuration de l'impression (nombre et décalage>
— <div id="print-sheets"> : planches d'étiquettes à imprimer

À l'exception du dernier élément, tous sont exclus de l'impression via une règle CSS :
@media print {
	#selected-label, #global-actions, #zoom_dialog, #config_dialog, #print-selector {
		display: none;
}

-->
<html lang="fr">
  
  <head>
    <meta charset="utf-8">
    <title>Étiquette QR</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="js/index.js" type="module"></script>

    <link rel="stylesheet" href="css/zoom.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  
  <body>
    <div id="selected-label">
        <h2><img src="./img/qrcode.png" alt="Icône étiquette"/> <span id="card_title">Enregistrement courant</span></h2>
        <div id="labels">
            <div id="label" class="label_box"><img src="" alt="Éventuelle étiquette courante" class="label invalid zoomable empty"/></div>
            <button id="save_label_btn">⬅ Enregistrer</button>
            <div id="preview" class="label_box"><img src="img/no_label.png" alt="Éventuelle étiquette candidate" class="zoomable empty"/></div>
        </div>
    </div>
    <div id="global-actions">
        <h2><img src="./img/globe.png" alt="Icône globe"/> Actions globales</h2>
        <!-- Mise à jour des visuels -->
        <button id="update_labels_btn">Mise à jour des visuels (<span class="label_count"></span>)</button>
        <!-- Modifie tous les liens -->
        <button id="trigger_url_update_btn">Renouvellement (<span class="label_count"></span>)</button>
    </div>
    <!-- Zoom -->

    <dialog id="zoom_dialog" class="zoom">
        <button commandfor="zoom_dialog" command="close" class="zoom_close_btn"></button>
        <img id="zoomed" src="" alt="Zoom sur étiquette" class="zoom"/>
    </dialog>

    <!-- Réglages -->

    <dialog id="config_dialog">
        <div>
            <div id="config_header">
                <div id="config_title">Configuration du widget</div>
                <button id="cancel_options_btn">Annuler</button>
                <button id="reset_options_btn">Reset</button>
                <button id="default_options_btn">Défaut</button>
                <button id="save_options_btn">Enregistrer</button>
            </div>
            <iframe id="configuration"
                    title="Configuration"
                    src="config.html"
                    loading="lazy">
            </iframe>
        </div>
    </dialog>

    <!-- Impression -->

    <div id="print-selector">
        <h2><img src="./img/printer.png" alt="Icône imprimante"/> Impression</h2>
        <label for="print-number">Nombre :</label>
        <input id="print-number" name="print-number" type="number" min="1" value="1" />

        <label for="print-offset">Décaler de :</label>
        <input id="print-offset" name="print-offset" type="number"  min="0" value="0" />
        <br/>
        <button id="print-btn">Imprimer<span id="label-count"></span></button>
    </div>
    <div id="print-sheets">

    </div>
  </body>
  
</html>
