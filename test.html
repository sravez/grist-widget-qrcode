<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>QR Code - Configuration</title>
  <style>
    #config_form {
      display: grid;
      grid-template-columns: repeat(2, 6em 15em);
      font-family: Verdana, sans-serif;
      font-size: 12px;
      align-items: start;
    }
    #config_form section {
      grid-column: span 2;
      display: grid;
      grid-template-columns: subgrid;
      grid-template-rows: auto;
      column-gap: 3px;
      grid-auto-rows: 20px;
      align-items: baseline;
    }
    .s_title {
      grid-column: 1 / -1;
      background-color: aliceblue;
      font-weight: bold;
      padding-top: 5px;
      padding-bottom: 5px;
    }
    label {
      justify-self: right;
    }
    input[type="color"] {
      width: 16px;
      height: 16px;
      padding:0;
      position: relative;
      top: 2px;
    }
  </style>
</head>

<body>
  <form id="config_form">
    <section id="s_display">
      <div class="s_title">display</div>
      <label>One</label><span>Un</span>
      <label>Two</label><span>Deux</span>
      <label>Three</label><span>Trois</span>
    </section>
    <section id="s_data">
      <div class="s_title">data</div>
      <label>One</label><span>Un</span>
      <label>Two</label><span>Deux</span>
    </section>
    <section id="s_qrcode">
      <div class="s_title">qrcode</div>

      <label>Dimensions</label>
      <span>c:<input type="color"/> d:<input type="color"/></span>

      <span></span>
      <span>Deux</span>

      <label>Couleurs</label>
      <span>Trois</span>
      <span></span>
      <span>Quatre</span>

    </section>
    <section id="s_preview">preview</section>
  </form>
</body>
</html>
